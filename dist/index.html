// Global object to accumulate metrics within the current second
let accumulatedMetrics = {
    // HTTP/HTTPS metrics
    httpSent: 0,
    httpReceived: 0,
    httpRequests: 0,
    // WebSocket metrics
    wsSent: 0,
    wsReceived: 0,
    wsMessages: 0,
    // Combined totals
    totalSent: 0,
    totalReceived: 0,
    totalRequests: 0
};

// References to original APIs for patching
const originalFetch = window.fetch;
const originalXMLHttpRequest = window.XMLHttpRequest;
const originalWebSocket = window.WebSocket;

/**
 * Updates the accumulated metrics.
 * @param {string} type - 'httpSent', 'httpReceived', 'httpRequest', 'wsSent', 'wsReceived', 'wsMessage'.
 * @param {number} value - The value to add to the metric.
 */
function updateAccumulatedMetrics(type, value) {
    switch(type) {
        case 'httpSent':
            accumulatedMetrics.httpSent += value;
            accumulatedMetrics.totalSent += value;
            break;
        case 'httpReceived':
            accumulatedMetrics.httpReceived += value;
            accumulatedMetrics.totalReceived += value;
            break;
        case 'httpRequest':
            accumulatedMetrics.httpRequests += value;
            accumulatedMetrics.totalRequests += value;
            break;
        case 'wsSent':
            accumulatedMetrics.wsSent += value;
            accumulatedMetrics.totalSent += value;
            break;
        case 'wsReceived':
            accumulatedMetrics.wsReceived += value;
            accumulatedMetrics.totalReceived += value;
            break;
        case 'wsMessage':
            accumulatedMetrics.wsMessages += value;
            break;
    }
}

/**
 * Calculate the byte size of WebSocket data
 */
function getWebSocketDataSize(data) {
    if (typeof data === 'string') {
        return new Blob([data]).size;
    } else if (data instanceof Blob) {
        return data.size;
    } else if (data instanceof ArrayBuffer) {
        return data.byteLength;
    } else if (data instanceof Uint8Array || data instanceof Int8Array) {
        return data.length;
    }
    return 0;
}

/**
 * Patches WebSocket to intercept sent/received data.
 */
function patchWebSocket() {
    window.WebSocket = function(url, protocols) {
        const ws = new originalWebSocket(url, protocols);
        
        console.log('WebSocket connection created:', url);
        
        // Patch the send method
        const originalSend = ws.send;
        ws.send = function(data) {
            const dataSize = getWebSocketDataSize(data);
            updateAccumulatedMetrics('wsSent', dataSize);
            updateAccumulatedMetrics('wsMessage', 1);
            
            console.log('WebSocket sent:', dataSize, 'bytes');
            
            return originalSend.call(this, data);
        };
        
        // Patch message reception
        let originalOnMessage = ws.onmessage;
        Object.defineProperty(ws, 'onmessage', {
            get: function() {
                return originalOnMessage;
            },
            set: function(handler) {
                originalOnMessage = function(event) {
                    const dataSize = getWebSocketDataSize(event.data);
                    updateAccumulatedMetrics('wsReceived', dataSize);
                    updateAccumulatedMetrics('wsMessage', 1);
                    
                    console.log('WebSocket received:', dataSize, 'bytes');
                    
                    if (handler) {
                        handler.call(this, event);
                    }
                };
            }
        });
        
        // Also handle addEventListener for 'message' events
        const originalAddEventListener = ws.addEventListener;
        ws.addEventListener = function(type, listener, options) {
            if (type === 'message') {
                const wrappedListener = function(event) {
                    const dataSize = getWebSocketDataSize(event.data);
                    updateAccumulatedMetrics('wsReceived', dataSize);
                    updateAccumulatedMetrics('wsMessage', 1);
                    
                    console.log('WebSocket received (addEventListener):', dataSize, 'bytes');
                    
                    if (typeof listener === 'function') {
                        listener.call(this, event);
                    } else if (listener && typeof listener.handleEvent === 'function') {
                        listener.handleEvent(event);
                    }
                };
                return originalAddEventListener.call(this, type, wrappedListener, options);
            }
            return originalAddEventListener.call(this, type, listener, options);
        };
        
        return ws;
    };
    
    // Copy static properties
    Object.setPrototypeOf(window.WebSocket, originalWebSocket);
    Object.getOwnPropertyNames(originalWebSocket).forEach(name => {
        if (name !== 'prototype' && name !== 'name' && name !== 'length') {
            Object.defineProperty(window.WebSocket, name, 
                Object.getOwnPropertyDescriptor(originalWebSocket, name));
        }
    });
}

/**
 * Sets up the PerformanceObserver to monitor HTTP resource loading.
 */
function setupPerformanceObserver() {
    const observer = new PerformanceObserver((list) => {
        list.getEntries().forEach((entry) => {
            if (entry.entryType === 'resource') {
                console.log('HTTP Resource entry:', entry.name, 'transferSize:', entry.transferSize);
                
                if (entry.transferSize) {
                    updateAccumulatedMetrics('httpReceived', entry.transferSize);
                }
            }
        });
    });
    observer.observe({ entryTypes: ['resource'] });
    return observer;
}

/**
 * Patches XMLHttpRequest to intercept requests and capture sent/received data.
 */
function patchXMLHttpRequest() {
    window.XMLHttpRequest = function () {
        const xhr = new originalXMLHttpRequest();
        let requestBodySize = 0;

        const originalOpen = xhr.open;
        xhr.open = function (...args) {
            updateAccumulatedMetrics('httpRequest', 1);
            originalOpen.apply(this, args);
        };

        const originalSend = xhr.send;
        xhr.send = function (data) {
            if (data) {
                if (typeof data === 'string') {
                    requestBodySize = new Blob([data]).size;
                } else if (data instanceof Blob) {
                    requestBodySize = data.size;
                } else if (data instanceof FormData) {
                    requestBodySize = 1000; // Rough estimate
                } else if (data instanceof URLSearchParams) {
                    requestBodySize = data.toString().length;
                }
            }
            
            const totalSentSize = requestBodySize + 500; // +500 for headers estimate
            updateAccumulatedMetrics('httpSent', totalSentSize);
            
            console.log('XHR Send - Body size:', requestBodySize, 'Total sent:', totalSentSize);
            
            originalSend.apply(this, arguments);
        };

        // Capture response size when request completes
        const originalOnReadyStateChange = xhr.onreadystatechange;
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                const responseSize = xhr.responseText ? xhr.responseText.length : 0;
                const responseHeadersSize = xhr.getAllResponseHeaders().length;
                const totalReceivedSize = responseSize + responseHeadersSize;
                
                updateAccumulatedMetrics('httpReceived', totalReceivedSize);
                console.log('XHR Response - Body size:', responseSize, 'Headers size:', responseHeadersSize);
            }
            
            if (originalOnReadyStateChange) {
                originalOnReadyStateChange.apply(this, arguments);
            }
        };

        return xhr;
    };
}

/**
 * Patches window.fetch to intercept requests and capture sent/received data.
 */
function patchFetch() {
    window.fetch = async function (input, init = {}) {
        updateAccumulatedMetrics('httpRequest', 1);

        let requestBodySize = 0;
        if (init.body) {
            if (typeof init.body === 'string') {
                requestBodySize = new Blob([init.body]).size;
            } else if (init.body instanceof Blob) {
                requestBodySize = init.body.size;
            } else if (init.body instanceof FormData) {
                requestBodySize = 1000; // Rough estimate
            } else if (init.body instanceof URLSearchParams) {
                requestBodySize = init.body.toString().length;
            }
        }
        
        const totalSentSize = requestBodySize + 500;
        updateAccumulatedMetrics('httpSent', totalSentSize);
        console.log('Fetch Send - Body size:', requestBodySize, 'Total sent:', totalSentSize);

        try {
            const response = await originalFetch(input, init);
            
            const clonedResponse = response.clone();
            
            clonedResponse.text().then(text => {
                const responseSize = text.length;
                const headersSize = Array.from(response.headers.entries())
                    .reduce((acc, [key, value]) => acc + key.length + value.length + 4, 0);
                
                const totalReceivedSize = responseSize + headersSize;
                updateAccumulatedMetrics('httpReceived', totalReceivedSize);
                console.log('Fetch Response - Body size:', responseSize, 'Headers size:', headersSize);
            }).catch(err => {
                const contentLength = response.headers.get('content-length');
                if (contentLength) {
                    updateAccumulatedMetrics('httpReceived', parseInt(contentLength) + 200);
                }
            });
            
            return response;
        } catch (error) {
            throw error;
        }
    };
}

/**
 * Monitor WebRTC stats for additional metrics (bandwidth, packets, etc.)
 */
async function monitorWebRTCStats() {
    for (const pc of activeWebRTCConnections) {
        try {
            const stats = await pc.getStats();
            let totalDataChannelBytesSent = 0;
            let totalDataChannelBytesReceived = 0;
            let totalTransportBytesSent = 0;
            let totalTransportBytesReceived = 0;
            let candidatePairBytesSent = 0;
            let candidatePairBytesReceived = 0;
            
            // Track different types of stats separately for debugging
            const statsDebug = {
                dataChannelReports: 0,
                transportReports: 0,
                candidatePairReports: 0,
                allReportTypes: new Set()
            };
            
            stats.forEach((report) => {
                statsDebug.allReportTypes.add(report.type);
                
                // Monitor data channel stats (most reliable for data channel traffic)
                if (report.type === 'data-channel') {
                    statsDebug.dataChannelReports++;
                    if (report.bytesSent !== undefined) {
                        totalDataChannelBytesSent += report.bytesSent;
                    }
                    if (report.bytesReceived !== undefined) {
                        totalDataChannelBytesReceived += report.bytesReceived;
                    }
                    if (report.messagesSent !== undefined && pc._previousDataChannelStats) {
                        const deltaMessages = report.messagesSent - (pc._previousDataChannelStats.messagesSent || 0);
                        if (deltaMessages > 0) {
                            updateAccumulatedMetrics('webrtcMessage', deltaMessages);
                        }
                    }
                }
                
                // Monitor transport stats
                if (report.type === 'transport') {
                    statsDebug.transportReports++;
                    if (report.bytesSent !== undefined) {
                        totalTransportBytesSent += report.bytesSent;
                    }
                    if (report.bytesReceived !== undefined) {
                        totalTransportBytesReceived += report.bytesReceived;
                    }
                }
                
                // Monitor candidate pair stats (most comprehensive but includes all traffic)
                if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                    statsDebug.candidatePairReports++;
                    if (report.bytesSent !== undefined) {
                        candidatePairBytesSent += report.bytesSent;
                    }
                    if (report.bytesReceived !== undefined) {
                        candidatePairBytesReceived += report.bytesReceived;
                    }
                }
                
                // Monitor outbound-rtp and inbound-rtp for media streams
                if (report.type === 'outbound-rtp' && report.mediaType === 'video') {
                    // This would capture video data, but we focus on data channels
                }
                if (report.type === 'inbound-rtp' && report.mediaType === 'video') {
                    // This would capture video data, but we focus on data channels
                }
            });
            
            // Use data channel stats as primary source, fallback to transport, then candidate pair
            let finalBytesSent = totalDataChannelBytesSent || totalTransportBytesSent || candidatePairBytesSent;
            let finalBytesReceived = totalDataChannelBytesReceived || totalTransportBytesReceived || candidatePairBytesReceived;
            
            // Calculate delta from previous stats
            if (pc._previousStats) {
                const deltaBytesSent = finalBytesSent - pc._previousStats.bytesSent;
                const deltaBytesReceived = finalBytesReceived - pc._previousStats.bytesReceived;
                
                if (deltaBytesSent > 0) {
                    updateAccumulatedMetrics('webrtcSent', deltaBytesSent);
                    console.log(`WebRTC Stats: Sent ${deltaBytesSent} bytes (Source: ${totalDataChannelBytesSent ? 'data-channel' : totalTransportBytesSent ? 'transport' : 'candidate-pair'})`);
                }
                if (deltaBytesReceived > 0) {
                    updateAccumulatedMetrics('webrtcReceived', deltaBytesReceived);
                    console.log(`WebRTC Stats: Received ${deltaBytesReceived} bytes (Source: ${totalDataChannelBytesReceived ? 'data-channel' : totalTransportBytesReceived ? 'transport' : 'candidate-pair'})`);
                }
            }
            
            // Store current stats for next comparison
            pc._previousStats = {
                bytesSent: finalBytesSent,
                bytesReceived: finalBytesReceived
            };
            
            // Store data channel specific stats
            pc._previousDataChannelStats = {
                messagesSent: totalDataChannelBytesSent > 0 ? 1 : 0 // Simplified tracking
            };
            
            // Debug logging (can be removed in production)
            if (statsDebug.dataChannelReports === 0 && statsDebug.transportReports === 0 && statsDebug.candidatePairReports === 0) {
                console.log('WebRTC Stats Debug: No relevant reports found. Available types:', Array.from(statsDebug.allReportTypes));
            }
            
        } catch (error) {
            console.log('Error getting WebRTC stats:', error);
        }
    }
}

/**
 * Sets up the PerformanceObserver to monitor HTTP resource loading.
 */
function setupPerformanceObserver() {
    const observer = new PerformanceObserver((list) => {
        list.getEntries().forEach((entry) => {
            if (entry.entryType === 'resource') {
                console.log('HTTP Resource entry:', entry.name, 'transferSize:', entry.transferSize);
                
                if (entry.transferSize) {
                    updateAccumulatedMetrics('httpReceived', entry.transferSize);
                }
            }
        });
    });
    observer.observe({ entryTypes: ['resource'] });
    return observer;
}

/**
 * Patches XMLHttpRequest to intercept requests and capture sent/received data.
 */
function patchXMLHttpRequest() {
    window.XMLHttpRequest = function () {
        const xhr = new originalXMLHttpRequest();
        let requestBodySize = 0;

        const originalOpen = xhr.open;
        xhr.open = function (...args) {
            updateAccumulatedMetrics('httpRequest', 1);
            originalOpen.apply(this, args);
        };

        const originalSend = xhr.send;
        xhr.send = function (data) {
            if (data) {
                if (typeof data === 'string') {
                    requestBodySize = new Blob([data]).size;
                } else if (data instanceof Blob) {
                    requestBodySize = data.size;
                } else if (data instanceof FormData) {
                    requestBodySize = 1000; // Rough estimate
                } else if (data instanceof URLSearchParams) {
                    requestBodySize = data.toString().length;
                }
            }
            
            const totalSentSize = requestBodySize + 500; // +500 for headers estimate
            updateAccumulatedMetrics('httpSent', totalSentSize);
            
            console.log('XHR Send - Body size:', requestBodySize, 'Total sent:', totalSentSize);
            
            originalSend.apply(this, arguments);
        };

        // Capture response size when request completes
        const originalOnReadyStateChange = xhr.onreadystatechange;
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                const responseSize = xhr.responseText ? xhr.responseText.length : 0;
                const responseHeadersSize = xhr.getAllResponseHeaders().length;
                const totalReceivedSize = responseSize + responseHeadersSize;
                
                updateAccumulatedMetrics('httpReceived', totalReceivedSize);
                console.log('XHR Response - Body size:', responseSize, 'Headers size:', responseHeadersSize);
            }
            
            if (originalOnReadyStateChange) {
                originalOnReadyStateChange.apply(this, arguments);
            }
        };

        return xhr;
    };
}
