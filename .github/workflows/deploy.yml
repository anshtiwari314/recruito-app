name : meeting-app-build-and-deploy

on:
  push:
    branches:
      - copilot-local

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout 
        uses: actions/checkout@v4

      - name: setup docker build 
        uses: docker/setup-buildx-action@v3

      - name: Log in to docker 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5 
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meeting-app:staging-v1.2
            ${{ secrets.DOCKERHUB_USERNAME }}/meeting-app:latest
    
  deploy: 
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
        - name: Execute Remote ssh commands 
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{secrets.SERVER_HOST}}
            username: ${{secrets.SERVER_USER}}
            key: ${{secrets.SSH_PRIVATE_KEY}}
            port: ${{secrets.SERVER_PORT}} 
            script: |
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

              #pull image 
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/meeting-app:latest

              # stop & clear container 
              docker stop meeting-app-container || true 
              docker rm meeting-app-container || true

              # Run the container 
              docker run -d \
                --name meeting-app-container \
                -p 80:80
                --restart always \
                ${{ secrets.DOCKERHUB_USERNAME }}/meeting-app:latest

              # Keep VirtualBox storage clean
              docker image prune -f


